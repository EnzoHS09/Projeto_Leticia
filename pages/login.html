<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cash - Login</title>
    <link rel="stylesheet" href="/css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="logo">
            <a href="dashboard.html"><svg class="logo-icon" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3v18h18" stroke="#32004F"></path>
                <path d="M7 16l4-4 3 3 6-6" stroke="#5d2a8b"></path>
                <path d="M17 6h3v3" stroke="#5d2a8b"></path>
            </svg></a>
            <span class="logo-my">My</span><span class="logo-cash">Cash</span>
        </div>
        
        <nav class="nav-menu">
            <a href="#" class="nav-link">Home</a>
            <div class="profile-icon">
                <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="7" r="4"></circle>
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="12" r="11"></circle>
                </svg>
            </div>
        </nav>
    </header>

    <main class="main-container">
        <h1 class="welcome-title">Bem Vindo de Volta!</h1>
        
        <div class="login-card">
            <div class="card-avatar">
                <svg viewBox="0 0 100 100" width="85" height="85">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="#ffffff" stroke-width="6"/>
                    <circle cx="50" cy="40" r="16" fill="#ffffff"/>
                    <path d="M 20 82 C 20 60, 35 58, 50 58 C 65 58, 80 60, 80 82 Z" fill="#ffffff"/>
                </svg>
            </div>

            <form class="login-form">
                <div class="input-group">
                    <input type="email" id="email" required placeholder=" ">
                    <label for="email" class="input-label">E-mail <span class="required">*</span></label>
                </div>

                <div class="input-group">
                    <input type="password" id="senha" required placeholder=" ">
                    <label for="senha" class="input-label">Senha <span class="required">*</span></label>
                </div>

                <button type="submit" class="submit-btn">Entrar</button>
            </form>
        </div>
    </main>

</body>
</html>
